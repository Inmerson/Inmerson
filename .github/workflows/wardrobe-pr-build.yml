name: Build Dolabim APK (PR)
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore prototype source
        shell: bash
        run: |
          B64=$(grep "echo 'H4s" .github/workflows/wardrobe-apk.yml | sed -E "s/.*echo '([^']+)'.*/\1/")
          echo "$B64" | base64 -d > /tmp/dolabim-src.tar.gz
          tar -xzf /tmp/dolabim-src.tar.gz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dolabim-prototype-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
